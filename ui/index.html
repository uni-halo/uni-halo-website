    tailwind.config = {
      theme: {

          fontFamily: { inter: ['Inter', 'sans-serif'] },

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #05080A; color: #fff; overflow-x: hidden; }

    /* 背景网格 */
    .bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* 水波纹动画 */
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .ripple-ring {
      animation: ripple 4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .ripple-ring-delay { animation-delay: 1.3s; }
    .ripple-ring-delay2 { animation-delay: 2.6s; }

    /* 浮动动画 */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    .float-anim { animation: float 5s ease-in-out infinite; }

    /* 呼吸光晕 */
    @keyframes breathe {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .breathe { animation: breathe 4s ease-in-out infinite; }

    /* 渐入 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .fade-in-up { animation: fadeInUp 0.9s ease-out both; }
    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }
    .delay-4 { animation-delay: 0.6s; }
    .delay-5 { animation-delay: 0.75s; }
    .delay-6 { animation-delay: 0.9s; }

    /* 光标闪烁 */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink::after {
      content: '|';
      animation: blink 1s step-end infinite;
      color: #3B82F6;
      margin-left: 2px;
      font-weight: 300;
    }

    /* 粒子 */
    @keyframes particle-float {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
    }
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      background: rgba(59,130,246,0.6);
      border-radius: 50%;
      animation: particle-float 6s ease-in-out infinite;
    }

    /* 链接hover下划线 */
    .link-underline {
      position: relative;
      display: inline-block;
    }
    .link-underline::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: #3B82F6;
      transition: width 0.3s ease;
    }
    .link-underline:hover::after { width: 100%; }

    /* 分隔线渐变 */
    .divider-gradient {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.3), transparent);
    }

    /* Logo光环 */
    @keyframes logo-halo {
      0%, 100% { box-shadow: 0 0 40px rgba(59,130,246,0.15), 0 0 80px rgba(59,130,246,0.08); }
      50% { box-shadow: 0 0 60px rgba(59,130,246,0.25), 0 0 120px rgba(59,130,246,0.12); }
    }
    .logo-halo { animation: logo-halo 4s ease-in-out infinite; }

    /* 进度条闪光 */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #05080A; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Toast */
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-10px) scale(0.95); }
    }
    .toast-enter { animation: toast-in 0.3s ease-out both; }
    .toast-exit { animation: toast-out 0.25s ease-in both; }
  </style>

  <script>
    // 初始化Lucide图标
    lucide.createIcons();

    // Toast功能
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast-enter pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl text-xs font-medium';
      toast.style.cssText = `
        background: rgba(20,25,30,0.95);
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(20px);
        color: rgba(255,255,255,0.8);
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        min-width: 220px;
      `;
      const iconMap = { info: 'ℹ️', success: '✅', warning: '⚠️' };
      toast.innerHTML = `<span>${iconMap[type] || 'ℹ️'}</span><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // 文档按钮
    document.getElementById('docsBtn').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('文档正在编写中，敬请期待 📖', 'info');
    });

    // 联系按钮
    document.getElementById('contactNav').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('联系方式即将公布 ✉️', 'info');
    });

    document.getElementById('footerMail').addEventListener('click', (e) => {
